<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>印想</title>
<style>
:root{--ink:#1d1d1b;--muted:#74726c;--line:#e4e2dc;--field:#f6f5f2;--accent:#2b63d9;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;padding:16px;background:#3a3d43;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px;font:15px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink)}
form{width:min(360px,100%);background:#fff;border-radius:16px;padding:30px 26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mark{display:flex;gap:6px;margin-bottom:18px}
.mark i{width:30px;height:30px;border-radius:7px;background:#e6e0d2;position:relative;display:block}
.mark i::after{content:attr(data-c);position:absolute;inset:0;display:grid;place-items:center;font:700 17px/1 system-ui,sans-serif;font-style:normal;color:#2a2d33}
.mark i:last-child{background:#e8772e}
.mark i:last-child::after{color:#fff}
h1{font-size:20px;margin:0 0 18px}
.f{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);outline:none;color:inherit}
input:focus{border-color:var(--accent)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:0 18px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#e{min-height:22px;margin-top:10px;font-size:13px;color:var(--bad)}
#e.ok{color:var(--muted)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>

  <div class="f">

  </div>
  <div id="e" role="alert"></div>
</form>
